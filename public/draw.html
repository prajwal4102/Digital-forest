<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Draw a Creature!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #0b4030, #145c40);
    user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; }

  /* top bar */
  #topbar { display: flex; align-items: center; gap: 10px; }
  #backBtn {
    border: none; border-radius: 12px; padding: 10px 14px; font-size: 1rem; font-weight: 800;
    background: rgba(255,255,255,.15); color: #eafff4; cursor: pointer; white-space: nowrap;
  }
  #title { color: #eafff4; font-weight: 800; font-size: 1.15rem; margin-right: auto; white-space: nowrap; }
  #name {
    border: none; border-radius: 12px; padding: 10px 14px; font-size: 1rem;
    width: 200px; background: rgba(255,255,255,.92); outline: none;
  }

  /* main row: tools + canvas */
  #main { flex: 1; display: flex; gap: 10px; min-height: 0; }
  #tools {
    width: 128px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    padding: 10px 6px; background: rgba(0,0,0,.22); border-radius: 18px;
    overflow-y: auto;
  }
  #swatches { display: grid; grid-template-columns: repeat(4, 26px); gap: 5px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); cursor: pointer;
  }
  .swatch.active { border-color: #ffd75e; transform: scale(1.18); box-shadow: 0 0 0 2px rgba(255,215,94,.4); }
  #pickerRow { display: flex; gap: 6px; }
  #hueStrip, #shadeStrip { border-radius: 8px; cursor: pointer; touch-action: none; }
  #brushRow { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #brushSize { width: 104px; }
  #brushPreviewWrap { height: 46px; display: flex; align-items: center; justify-content: center; }
  #brushPreview { border-radius: 50%; background: #1c1c1c; box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
  .divider { width: 70%; height: 1px; background: rgba(255,255,255,.2); }
  #toolRow { display: flex; gap: 6px; }
  .toolBtn {
    width: 35px; height: 40px; border-radius: 10px; border: 2px solid transparent;
    background: rgba(255,255,255,.15); cursor: pointer; font-size: 17px; flex-shrink: 0;
  }
  .toolBtn.active { border-color: #ffd75e; background: rgba(255,255,255,.3); }

  #canvasWrap {
    flex: 1; position: relative; border-radius: 20px; overflow: hidden;
    background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* bottom bar */
  #bottombar { display: flex; gap: 10px; }
  #sendBtn {
    flex: 1; border: none; border-radius: 16px; padding: 16px;
    font-size: 1.35rem; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, #ffd75e, #ffb347);
    color: #4a3200; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    transition: transform .1s;
  }
  #sendBtn:active { transform: scale(.97); }
  #sendBtn:disabled { opacity: .5; }

  /* choose-your-animal gallery */
  #chooser {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; gap: 14px;
    background: linear-gradient(160deg, #0b4030, #145c40);
    padding: 18px; overflow-y: auto; touch-action: pan-y;
  }
  #chooser.show { display: flex; }
  #chooserTitle { color: #eafff4; font-size: 1.7rem; font-weight: 800; text-align: center; }
  #chooserSub { color: rgba(234,255,244,.7); margin-top: -8px; }
  #cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px; width: 100%; max-width: 1100px;
  }
  .animalCard {
    background: #fff; border: 4px solid transparent; border-radius: 18px;
    padding: 10px; cursor: pointer; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
    transition: transform .12s;
  }
  .animalCard:active { transform: scale(.96); }
  .animalCard img { width: 100%; height: 130px; object-fit: contain; pointer-events: none; }
  .animalCard .cardEmoji { font-size: 86px; line-height: 130px; height: 130px; }
  .animalCard .cardName {
    font-weight: 800; font-size: 1.15rem; color: #0b4030; margin-top: 6px;
  }

  /* sent overlay (freehand mode only) */
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(6,40,30,.88); z-index: 10; color: #eafff4; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: 5rem; animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
  #overlay .msg { font-size: 1.6rem; font-weight: 800; }
  #overlay .sub { opacity: .75; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  #connBadge {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: #a33; color: #fff; font-size: .85rem; padding: 6px 14px;
    border-radius: 999px; display: none; z-index: 40;
  }
  #connBadge.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="backBtn">🐾 Animals</button>
    <div id="title">🎨 Colour your animal!</div>
    <input id="name" placeholder="Your name (optional)" maxlength="20" autocomplete="off">
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="canvasWrap"><canvas id="pad"></canvas></div>
  </div>
  <div id="bottombar">
    <button id="sendBtn">🌿 Send to the Jungle! 🌿</button>
  </div>
</div>
<div id="chooser">
  <div id="chooserTitle">Which animal will you bring to life?</div>
  <div id="chooserSub">Tap one to start colouring</div>
  <div id="cards"></div>
</div>
<div id="overlay">
  <div class="big" id="ovEmoji">🦁</div>
  <div class="msg">Your creature is alive in the jungle!</div>
  <div class="sub">Look at the big screen! 👀</div>
</div>
<div id="connBadge">Reconnecting to the jungle…</div>
<script src="draw.js"></script>
</body>
</html>
